<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Snake — Thunderr⚡⚡ (Deluxe RGB + Backsound)</title>
  <style>
    :root{
      --bg:#071026; --panel:#071829; --accent:#22c55e; --muted:#94a3b8; --danger:#ef4444;
      --glass: rgba(255,255,255,0.03); --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:var(--font);background:linear-gradient(180deg,#041021 0%, #071018 100%);color:#e6eef8;overflow:hidden}
    .app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;gap:18px;position:relative;}
    .stage{width:100%;max-width:1000px;height:640px;position:relative;overflow:hidden;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,0.6);display:flex;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));}

    /* Intro (pre-game) */
    .intro{
      position:absolute;inset:0;background:linear-gradient(180deg,#07172a,#021018);display:flex;align-items:center;justify-content:center;padding:28px;transition:transform .55s cubic-bezier(.2,.9,.3,1),opacity .45s;
      z-index:30;
    }
    .intro.hide{ transform: translateX(-110%); opacity:0; pointer-events:none; }
    .intro-card{width:560px; background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.015)); border-radius:12px;padding:20px;box-shadow:0 6px 26px rgba(2,6,23,0.6); }
    .intro h2{margin:0;color:var(--accent);font-size:20px}
    .intro p{color:var(--muted);margin:8px 0 14px}

    .form-row{display:flex;gap:8px;margin-bottom:10px}
    .form-row input, .form-row select{flex:1;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:rgba(255,255,255,0.02);color:var(--muted)}
    .btn{padding:10px 14px;border-radius:8px;border:none;cursor:pointer;background:linear-gradient(90deg,#164e2d,#1ea85b);color:#062215;font-weight:700}

    /* Game container (slides in when intro hides) */
    .game-wrap{display:flex;gap:16px;padding:18px;align-items:stretch;transition:transform .55s cubic-bezier(.2,.9,.3,1);}
    .game-wrap.shift{ transform: translateX(-20px); } /* slight parallax during slide */

    .canvas-panel{flex:1;display:flex;align-items:center;justify-content:center;padding:12px;}
    canvas{border-radius:10px;background:linear-gradient(180deg,#07172a,#021018);box-shadow: inset 0 2px 10px rgba(0,0,0,0.5); width:560px;height:560px; image-rendering: pixelated;}

    .panel{width:340px;padding:14px;background:var(--panel);border-radius:10px;display:flex;flex-direction:column;gap:12px;}
    .meta{font-size:13px;color:var(--muted)}
    .score-row{display:flex;gap:8px;align-items:center;justify-content:space-between}
    .big-score{font-size:28px;font-weight:700;color:#fff}
    .controls{display:flex;flex-wrap:wrap;gap:8px}
    button{background:var(--glass);border:1px solid rgba(255,255,255,0.04);color:var(--muted);padding:8px 10px;border-radius:8px;cursor:pointer}
    button.primary{background:linear-gradient(90deg,#164e2d,#1ea85b);border:none;color:#062215;font-weight:700}
    .small{font-size:12px;color:var(--muted)}
    .leaderboard{max-height:200px;overflow:auto;padding:8px;background:rgba(255,255,255,0.02);border-radius:8px}
    .lb-row{display:flex;justify-content:space-between;padding:6px 4px;border-bottom:1px dashed rgba(255,255,255,0.06);font-size:13px;align-items:center}
    .flag{font-size:18px;margin-right:8px}

    #notification { position: fixed; bottom: 16px; right: 16px; background: rgba(34,197,94,0.95); color: white; padding: 10px 16px; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.3); opacity: 0; pointer-events: none; transform: translateY(10px); transition: opacity 0.3s, transform 0.3s; z-index: 9999; font-family: system-ui, sans-serif;}

    /* more visible neon grid */
    .neon-grid-line { stroke: rgba(34,197,94,0.12); stroke-width:0.9; filter: drop-shadow(0 0 4px rgba(34,197,94,0.06)); }
    .neon-grid-strong { stroke: rgba(255,255,255,0.04); stroke-width:1.2; opacity:0.14; }

    /* responsive adjustments */
    @media (max-width:980px){
      .stage{flex-direction:column;height:100%}
      canvas{width:100%;height:auto;max-width:560px}
      .panel{width:100%}
      .intro-card{width:100%}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="stage" id="stage">
      <!-- Intro / Pre-game -->

        <div class="intro-card">

              <option value="Kazakhstan"></option><option value="Kenya"></option><option value="Kiribati"></option>
              <option value="Kuwait"></option><option value="Kyrgyzstan"></option>
              <option value="Laos"></option><option value="Latvia"></option><option value="Lebanon"></option>
              <option value="Lesotho"></option><option value="Liberia"></option><option value="Libya"></option>
              <option value="Liechtenstein"></option><option value="Lithuania"></option><option value="Luxembourg"></option>
              <option value="Madagascar"></option><option value="Malawi"></option><option value="Malaysia"></option>

              <option value="Netherlands"></option><option value="New Zealand"></option><option value="Nicaragua"></option>
              <option value="Niger"></option><option value="Nigeria"></option><option value="North Korea"></option>
              <option value="North Macedonia"></option><option value="Norway"></option>
              <option value="Oman"></option>
              <option value="Pakistan"></option><option value="Palau"></option><option value="Panama"></option>
              <option value="Papua New Guinea"></option><option value="Paraguay"></option><option value="Peru"></option>
              <option value="Philippines"></option><option value="Poland"></option><option value="Portugal"></option>
              <option value="Qatar"></option>
              <option value="Romania"></option><option value="Russia"></option><option value="Rwanda"></option>
              <option value="Saint Kitts and Nevis"></option><option value="Saint Lucia"></option><option value="Samoa"></option>
              <option value="San Marino"></option><option value="Sao Tome and Principe"></option><option value="Saudi Arabia"></option>
              <option value="Senegal"></option><option value="Serbia"></option><option value="Seychelles"></option>
              <option value="Sierra Leone"></option><option value="Singapore"></option><option value="Slovakia"></option>
              <option value="Slovenia"></option><option value="Solomon Islands"></option><option value="Somalia"></option>
              <option value="South Africa"></option><option value="South Korea"></option><option value="South Sudan"></option>
              <option value="Spain"></option><option value="Sri Lanka"></option><option value="Sudan"></option>
              <option value="Suriname"></option><option value="Sweden"></option><option value="Switzerland"></option>
              <option value="Syria"></option>
              <option value="Taiwan"></option><option value="Tajikistan"></option><option value="Tanzania"></option>
              <option value="Thailand"></option><option value="Togo"></option><option value="Tonga"></option>
              <option value="Trinidad and Tobago"></option><option value="Tunisia"></option><option value="Turkey"></option>
              <option value="Turkmenistan"></option><option value="Tuvalu"></option>
              <option value="Uganda"></option><option value="Ukraine"></option><option value="United Arab Emirates"></option>
              <option value="United Kingdom"></option><option value="United States"></option><option value="Uruguay"></option>
              <option value="Uzbekistan"></option>
              <option value="Vanuatu"></option><option value="Vatican City"></option><option value="Venezuela"></option>
              <option value="Vietnam"></option>
              <option value="Yemen"></option>
              <option value="Zambia"></option><option value="Zimbabwe"></option>
            </datalist>
          </div>

          <div style="display:flex;gap:8px;align-items:center;margin-top:8px">
            <button class="btn" id="btnStartIntro">Mulai Main</button>
            <button class="btn" id="btnDemo" style="background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted)">Demo</button>
          </div>
        </div>
      </div>

      <!-- Main Game UI -->
      <div style="display:flex;flex:1;" id="mainUI">
        <div class="game-wrap" id="gameWrap">
          <div class="canvas-panel">
            <canvas id="game" width="560" height="560"></canvas>
          </div>

          <aside class="panel">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div>
                <h1 style="margin:0;color:var(--accent);font-size:18px">Ular Mager 😫😫</h1>

              </div>
              <div style="text-align:right">
                <div class="small">Score</div>
                <div class="big-score" id="score">0</div>
                <div class="small" style="margin-top:6px">High</div>

              <div><div class="small">Warna Ular</div><input id="colorPicker" type="color" value="#22c55e" /></div>
              <div><div class="small">Aksesoris</div>
                <select id="accessory">
                  <option value="none">Tanpa Aksesoris</option>
                  <option value="hat">Topi 🎩</option>
                  <option value="glasses">Kacamata 🕶️</option>
                  <option value="crown">Mahkota 👑</option>

            </div>

            <div class="score-row" style="align-items:center">
              <div style="flex:1">
                <div class="small">Mode Warna</div>

                  <option value="manual">Manual</option>

              <button id="start" class="primary">Start / Restart</button>
              <button id="pause">Pause</button>

            </div>

            <div>
              <div class="small">Leaderboard</div>

  <div id="notification"></div>
  <audio id="bgm" src="zeldyy.mp3" loop preload="auto"></audio>

<script>
/* ===========================
   Game + Intro + Country/Flag
   =========================== */
(function(){
  // --- Helpers ---
  function showNotification(msg){
    const n=document.getElementById('notification');
    n.textContent=msg;
    n.style.opacity=1;n.style.transform='translateY(0)';
    setTimeout(()=>{n.style.opacity=0;n.style.transform='translateY(10px)';},2200);
  }

  // Convert ISO country code (2 letters) to emoji flag
  function countryCodeToEmoji(code){
    if(!code || code.length !== 2) return '';
    const A = 0x1F1E6;
    const chars = [...code.toUpperCase()].map(c => A + c.charCodeAt(0) - 65);
    return String.fromCodePoint(...chars);
  }

  // A mapping of common country names -> ISO alpha-2 codes
  // (Used to display emoji flags; list covers most frequent countries. Manual input will fallback.)
  const countryNameToCode = {
    "Afghanistan":"AF","Albania":"AL","Algeria":"DZ","Andorra":"AD","Angola":"AO","Argentina":"AR","Armenia":"AM",
    "Australia":"AU","Austria":"AT","Azerbaijan":"AZ","Bahamas":"BS","Bahrain":"BH","Bangladesh":"BD","Barbados":"BB",
    "Belarus":"BY","Belgium":"BE","Belize":"BZ","Benin":"BJ","Bhutan":"BT","Bolivia":"BO","Bosnia and Herzegovina":"BA",
    "Botswana":"BW","Brazil":"BR","Brunei":"BN","Bulgaria":"BG","Burkina Faso":"BF","Burundi":"BI",
    "Cambodia":"KH","Cameroon":"CM","Canada":"CA","Cape Verde":"CV","Central African Republic":"CF","Chad":"TD",
    "Chile":"CL","China":"CN","Colombia":"CO","Comoros":"KM","Congo":"CG","Costa Rica":"CR","Croatia":"HR","Cuba":"CU",
    "Cyprus":"CY","Czech Republic":"CZ","Denmark":"DK","Djibouti":"DJ","Dominica":"DM","Dominican Republic":"DO",
    "Ecuador":"EC","Egypt":"EG","El Salvador":"SV","Equatorial Guinea":"GQ","Eritrea":"ER","Estonia":"EE","Eswatini":"SZ",
    "Ethiopia":"ET","Fiji":"FJ","Finland":"FI","France":"FR","Gabon":"GA","Gambia":"GM","Georgia":"GE","Germany":"DE",
    "Ghana":"GH","Greece":"GR","Grenada":"GD","Guatemala":"GT","Guinea":"GN","Guinea-Bissau":"GW","Guyana":"GY",
    "Haiti":"HT","Honduras":"HN","Hungary":"HU","Iceland":"IS","India":"IN","Indonesia":"ID","Iran":"IR","Iraq":"IQ",
    "Ireland":"IE","Israel":"IL","Italy":"IT","Jamaica":"JM","Japan":"JP","Jordan":"JO","Kazakhstan":"KZ","Kenya":"KE",
    "Kiribati":"KI","Kuwait":"KW","Kyrgyzstan":"KG","Laos":"LA","Latvia":"LV","Lebanon":"LB","Lesotho":"LS","Liberia":"LR",
    "Libya":"LY","Liechtenstein":"LI","Lithuania":"LT","Luxembourg":"LU","Madagascar":"MG","Malawi":"MW","Malaysia":"MY",
    "Maldives":"MV","Mali":"ML","Malta":"MT","Marshall Islands":"MH","Mauritania":"MR","Mauritius":"MU","Mexico":"MX",
    "Micronesia":"FM","Moldova":"MD","Monaco":"MC","Mongolia":"MN","Montenegro":"ME","Morocco":"MA","Mozambique":"MZ",
    "Myanmar":"MM","Namibia":"NA","Nauru":"NR","Nepal":"NP","Netherlands":"NL","New Zealand":"NZ","Nicaragua":"NI",
    "Niger":"NE","Nigeria":"NG","North Korea":"KP","North Macedonia":"MK","Norway":"NO","Oman":"OM","Pakistan":"PK",
    "Palau":"PW","Panama":"PA","Papua New Guinea":"PG","Paraguay":"PY","Peru":"PE","Philippines":"PH","Poland":"PL",
    "Portugal":"PT","Qatar":"QA","Romania":"RO","Russia":"RU","Rwanda":"RW","Saint Kitts and Nevis":"KN","Saint Lucia":"LC",
    "Samoa":"WS","San Marino":"SM","Sao Tome and Principe":"ST","Saudi Arabia":"SA","Senegal":"SN","Serbia":"RS",
    "Seychelles":"SC","Sierra Leone":"SL","Singapore":"SG","Slovakia":"SK","Slovenia":"SI","Solomon Islands":"SB",
    "Somalia":"SO","South Africa":"ZA","South Korea":"KR","South Sudan":"SS","Spain":"ES","Sri Lanka":"LK","Sudan":"SD",
    "Suriname":"SR","Sweden":"SE","Switzerland":"CH","Syria":"SY","Taiwan":"TW","Tajikistan":"TJ","Tanzania":"TZ",
    "Thailand":"TH","Togo":"TG","Tonga":"TO","Trinidad and Tobago":"TT","Tunisia":"TN","Turkey":"TR","Turkmenistan":"TM",
    "Tuvalu":"TV","Uganda":"UG","Ukraine":"UA","United Arab Emirates":"AE","United Kingdom":"GB","United States":"US",
    "Uruguay":"UY","Uzbekistan":"UZ","Vanuatu":"VU","Vatican City":"VA","Venezuela":"VE","Vietnam":"VN","Yemen":"YE",
    "Zambia":"ZM","Zimbabwe":"ZW"
  };

  // --- Elements ---
  const intro = document.getElementById('intro');
  const introName = document.getElementById('introName');
  const introCountry = document.getElementById('introCountry');
  const btnStartIntro = document.getElementById('btnStartIntro');
  const btnDemo = document.getElementById('btnDemo');
  const gameWrap = document.getElementById('gameWrap');
  const playerMeta = document.getElementById('playerMeta');
  const leaderboardEl = document.getElementById('leaderboard');

  // --- Game variables (kept concise; core of prior smooth snake code included) ---
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha:false });
  const INTERNAL = 560, GRID = 20, TILE = INTERNAL / GRID;
  canvas.width = INTERNAL; canvas.height = INTERNAL;

  let snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}], dir={x:1,y:0}, nextDir={x:1,y:0};
  let prevPositions = JSON.parse(JSON.stringify(snake)), nextPositions = JSON.parse(JSON.stringify(snake));
  let interp = 1, accumulator = 0, lastTime = 0;
  let food = null, score = 0, highScore = 0;
  let running=false, paused=false, manualMult=1, autoMult=1;
  let tilesPerSecond = 6; const BASE_TILES = 6;
  let headTrail = [];

  // Color & accessories elements
  const colorPicker = document.getElementById('colorPicker'), accessory = document.getElementById('accessory'), colorMode = document.getElementById('colorMode');
  const scoreEl = document.getElementById('score'), highEl = document.getElementById('high'), speedDisplay = document.getElementById('speedDisplay');
  const startBtn = document.getElementById('start'), pauseBtn = document.getElementById('pause'), speedUp = document.getElementById('speedUp'), speedDown = document.getElementById('speedDown');
  const bgm = document.getElementById('bgm');

  // Colors state
  let hueShift = 0;
  let COLORS = { bg:'#021018', snake: colorPicker.value, snakeHead:'#22c55e', food:'#ef4444', grid:'#072033' };

  /* -------------------------
     Country & Intro handling
     ------------------------- */
  function getCountryCodeFromName(name){
    if(!name) return null;
    const n = name.trim();
    // if user entered 2-letter code, accept it
    if(/^[A-Za-z]{2}$/.test(n)) return n.toUpperCase();
    // try direct map
    if(countryNameToCode[n]) return countryNameToCode[n];
    // try title-case variants: e.g., "united states" -> "United States"
    const cap = n.split(' ').map(w => w[0] ? (w[0].toUpperCase()+w.slice(1).toLowerCase()) : '').join(' ');
    if(countryNameToCode[cap]) return countryNameToCode[cap];
    return null;
  }

  function getFlagForCountryInput(input){
    const code = getCountryCodeFromName(input);
    if(code) return countryCodeToEmoji(code);
    // fallback: if input contains country emoji directly (rare), return it
    // else return empty string
    return '';
  }

  function applyPlayerMeta(name,country){
    const flag = getFlagForCountryInput(country);
    playerMeta.innerHTML = `<strong>${escapeHtml(name || '')}</strong> ${flag ? ('<span class="flag">'+flag+'</span>') : ''}<div class="small">${escapeHtml(country||'')}</div>`;
  }

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, (m)=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m])); }

  btnStartIntro.addEventListener('click', ()=>{
    const name = (introName.value||'').trim();
    const country = (introCountry.value||'').trim();
    if(!name){ showNotification('Isi nama dulu!'); return; }
    if(!country){ showNotification('Isi negara dulu!'); return; }

    // slide intro left -> hide
    intro.classList.add('hide');
    // slight shift on game wrap (parallax feel)
    gameWrap.classList.add('shift');

    // update player meta with flag
    applyPlayerMeta(name, country);

    // store current player for leaderboard
    currentPlayer = { name, country };
    // set highScore from storage
    highScore = getPlayerHigh(name)?.score || 0;
    highEl.textContent = highScore;

    showNotification(`Selamat datang ${name}${getFlagForCountryInput(country) ? ' ' + getFlagForCountryInput(country) : ''} dari ${country}!`);
  });

  // quick demo that fills values and starts game (no strict validation)
  btnDemo.addEventListener('click', ()=>{
    introName.value = 'DemoPlayer';
    introCountry.value = 'Indonesia';
    btnStartIntro.click();
  });

  /* -------------------------
     Leaderboard (store name+country+score)
     ------------------------- */
  function loadLeaderboard(){
    const board = JSON.parse(localStorage.getItem('snake_board')||'{}');
    // board is {name: {score:NUM, country: "Indonesia"}}
    const entries = Object.entries(board).sort((a,b)=> (b[1].score - a[1].score)).slice(0,10);
    leaderboardEl.innerHTML = entries.map(([n,obj])=>{
      const flag = getFlagForCountryInput(obj.country);
      return `<div class="lb-row"><div><span class="flag">${flag||''}</span><strong>${escapeHtml(n)}</strong> <div class="small" style="display:inline;margin-left:6px">${escapeHtml(obj.country||'')}</div></div><div>${obj.score}</div></div>`;
    }).join('') || '<div class="lb-row"><i>Belum ada data</i></div>';
  }

  function saveLeaderboardEntry(name, country, newHigh){
    if(!name) return;
    let board = JSON.parse(localStorage.getItem('snake_board')||'{}');
    const existing = board[name];
    if(!existing || newHigh > existing.score){
      board[name] = { score: newHigh, country: country || '' };
      localStorage.setItem('snake_board', JSON.stringify(board));
    }
  }

  function getPlayerHigh(name){
    const board = JSON.parse(localStorage.getItem('snake_board')||'{}');
    return board[name] || null;
  }

  document.getElementById('refreshLB').addEventListener('click', ()=>{
    const confirmReset = confirm("Apakah kamu ingin menghapus seluruh data leaderboard?");
    if(confirmReset){
      localStorage.removeItem('snake_board');
      leaderboardEl.innerHTML = '<div class="lb-row"><i>Leaderboard telah direset</i></div>';
      showNotification("Leaderboard berhasil direset 🧹");
    } else {
      loadLeaderboard();
      showNotification("Leaderboard diperbarui 🔁");
    }
  });

  /* -------------------------
     Core game logic (smooth movement + interpolated head)
     ------------------------- */
  function adjustBrightness(hex, factor){
    const c = parseInt(hex.slice(1),16);
    let r = Math.min(255, Math.round(((c>>16)&255)*factor));
    let g = Math.min(255, Math.round(((c>>8)&255)*factor));
    let b = Math.min(255, Math.round((c&255)*factor));
    return `rgb(${r},${g},${b})`;
  }

  function updateColor(dt){
    if(colorMode.value === 'rgb'){
      hueShift = (hueShift + dt*60) % 360;
      COLORS.snake = `hsl(${Math.floor(hueShift)},95%,45%)`;
      COLORS.snakeHead = `hsl(${Math.floor((hueShift+30)%360)},95%,60%)`;
    } else {
      COLORS.snake = colorPicker.value;
      COLORS.snakeHead = adjustBrightness(colorPicker.value, 1.35);
    }
  }

  function placeFood(){
    while(true){
      const fx = Math.floor(Math.random()*GRID), fy = Math.floor(Math.random()*GRID);
      if(!snake.some(s=>s.x===fx && s.y===fy)){ food = {x:fx,y:fy}; return; }
    }
  }

  function updateSpeed(){
    const mult = manualMult * autoMult;
    tilesPerSecond = BASE_TILES * mult;
    speedDisplay.textContent = mult.toFixed(2) + '×';
  }

  function resetGame(){
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir = {x:1,y:0}; nextDir = {...dir};
    prevPositions = JSON.parse(JSON.stringify(snake)); nextPositions = JSON.parse(JSON.stringify(snake));
    interp = 1; accumulator = 0; score = 0; food = null; placeFood();
    running = true; paused = false; headTrail = [];
    scoreEl.textContent = score;
    updateSpeed();
  }

  function performStep(){
    // accept nextDir unless reversing
    if(!(nextDir.x === -dir.x && nextDir.y === -dir.y && snake.length > 1)) dir = {...nextDir};
    const head = snake[0];
    const nh = { x: head.x + dir.x, y: head.y + dir.y };
    // collisions
    if(nh.x < 0 || nh.x >= GRID || nh.y < 0 || nh.y >= GRID || snake.some(s=>s.x===nh.x&&s.y===nh.y)){
      // game over
      running = false;
      showNotification("Game Over! Skor: " + score);
      // save leaderboard entry with current player's country if exists
      if(currentPlayer) saveLeaderboardEntry(currentPlayer.name, currentPlayer.country, Math.max(score, highScore));
      loadLeaderboard();
      highScore = Math.max(highScore, score);
      highEl.textContent = highScore;
      return;
    }
    prevPositions = JSON.parse(JSON.stringify(snake));
    snake.unshift(nh);
    if(nh.x === food.x && nh.y === food.y){
      score += 10; scoreEl.textContent = score;
      if(score > highScore){ highScore = score; highEl.textContent = highScore; }
      placeFood(); computeAuto();
    } else {
      snake.pop();
    }
    nextPositions = JSON.parse(JSON.stringify(snake));
    interp = 0;
  }

  function computeAuto(){
    const bump = Math.floor(score / 50);
    autoMult = 1 + bump * 0.12;
    updateSpeed();
  }

  // Drawing functions
  function drawBackground(){
    // fill bg
    ctx.fillStyle = COLORS.bg || '#021018';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    // neon grid: draw stronger visible tiles
    ctx.save();
    // cell background gradient subtle
    const grad = ctx.createLinearGradient(0,0,0,canvas.height);
    grad.addColorStop(0, 'rgba(255,255,255,0.01)');
    grad.addColorStop(1, 'rgba(0,0,0,0.02)');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // draw grid lines with higher contrast
    ctx.lineWidth = 0.9;
    for(let i=0;i<=GRID;i++){
      const p = i * TILE;
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(34,197,94,0.08)'; // neon subtle
      ctx.moveTo(p,0); ctx.lineTo(p,canvas.height); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0,p); ctx.lineTo(canvas.width,p); ctx.stroke();
    }
    // stronger grid every 5 tiles
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    for(let i=0;i<=GRID;i+=5){
      const p = i * TILE;
      ctx.beginPath(); ctx.moveTo(p,0); ctx.lineTo(p,canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,p); ctx.lineTo(canvas.width,p); ctx.stroke();
    }
    ctx.restore();
  }

  function roundRect(ctx,x,y,w,h,r,fill){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
    if(fill) ctx.fill();
  }

  function updateHeadTrail(pos){
    headTrail.unshift(pos);
    if(headTrail.length > 12) headTrail.pop();
  }

  function drawTrail(){
    for(let i=headTrail.length-1;i>=0;i--){
      const p = headTrail[i];
      const t = (i+1) / (headTrail.length+1);
      const size = TILE * (0.8 * t);
      ctx.globalAlpha = 0.08 * t;
      const grad = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,size*1.2);
      grad.addColorStop(0, COLORS.snake);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(p.x,p.y,size,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawFood(){
    const px = food.x * TILE + TILE/2, py = food.y * TILE + TILE/2;
    ctx.save();
    ctx.shadowBlur = 12; ctx.shadowColor = COLORS.food;
    ctx.fillStyle = COLORS.food;
    ctx.beginPath(); ctx.arc(px,py,TILE*0.35,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function ellipse(ctx, cx, cy, rx, ry){
    ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); ctx.fill();
  }

  function drawBody(t){
    const len = Math.max(prevPositions.length, nextPositions.length);
    for(let i=0;i<len;i++){
      const a = prevPositions[i] || prevPositions[prevPositions.length-1];
      const b = nextPositions[i] || nextPositions[nextPositions.length-1];
      const px = (a.x + (b.x - a.x)*t) * TILE + 1;
      const py = (a.y + (b.y - a.y)*t) * TILE + 1;
      const s = TILE - 2;
      ctx.fillStyle = COLORS.snake;
      roundRect(ctx, px, py, s, s, 6, true);
    }
  }

  function drawHead(t){
    const a = prevPositions[0] || nextPositions[0];
    const b = nextPositions[0] || prevPositions[0];
    const p = { x: a.x + (b.x-a.x)*t, y: a.y + (b.y-a.y)*t };
    const px = p.x * TILE + TILE/2, py = p.y * TILE + TILE/2;

    const a2 = prevPositions[1] || prevPositions[0];
    const b2 = nextPositions[1] || nextPositions[0];
    const s = { x: a2.x + (b2.x-a2.x)*t, y: a2.y + (b2.y-a2.y)*t };
    const vx = p.x - s.x, vy = p.y - s.y;
    const angle = Math.atan2(vy, vx);

    ctx.save();
    ctx.translate(px,py); ctx.rotate(angle);

    const headLen = TILE*0.95, headR = TILE*0.45;
    ctx.beginPath();
    ctx.moveTo(-headLen*0.15, -headR);
    ctx.quadraticCurveTo(headLen*0.6, -headR, headLen*0.95, 0);
    ctx.quadraticCurveTo(headLen*0.6, headR, -headLen*0.15, headR);
    ctx.closePath();

    ctx.shadowBlur = 20; ctx.shadowColor = COLORS.snakeHead;
    ctx.fillStyle = COLORS.snakeHead; ctx.fill();
    ctx.shadowBlur = 0;

    // highlight
    ctx.beginPath();
    ctx.moveTo(-headLen*0.05, -headR*0.5);
    ctx.quadraticCurveTo(headLen*0.5, -headR*0.6, headLen*0.85, 0);
    ctx.quadraticCurveTo(headLen*0.5, headR*0.6, -headLen*0.05, headR*0.5);
    ctx.closePath();
    ctx.globalAlpha = 0.12; ctx.fillStyle = '#fff'; ctx.fill(); ctx.globalAlpha = 1;

    // eyes (elongated)
    ctx.fillStyle = '#000';
    const ex = headLen*0.45, ey = headR*0.36;
    ellipse(ctx, ex, -ey, TILE*0.09, TILE*0.16);
    ellipse(ctx, ex, ey, TILE*0.09, TILE*0.16);
    // pupils small bright
    ctx.fillStyle = '#fff';
    ellipse(ctx, ex + TILE*0.02, -ey, TILE*0.03, TILE*0.06);
    ellipse(ctx, ex + TILE*0.02, ey, TILE*0.03, TILE*0.06);

    // accessory relative to head orientation
    drawAccessoryOnHead(ctx, accessory.value, headLen, headR);

    ctx.restore();

    // trail push
    updateHeadTrail({ x: px, y: py });
  }

  function drawAccessoryOnHead(ctx, acc, headLen, headR){
    if(!acc || acc === 'none') return;
    ctx.save();
    if(acc === 'hat'){
      ctx.fillStyle = '#ffcc00';
      roundRect(ctx, -headLen*0.25, -headR - 6, headLen*0.6, 8, 4, true);
    } else if(acc === 'glasses'){
      ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
      ctx.strokeRect(headLen*0.10, -headR*0.35, 14, 9);
      ctx.strokeRect(headLen*0.40, headR*0.05, 14, 9);
      ctx.beginPath(); ctx.moveTo(headLen*0.10+14, -headR*0.35+4); ctx.lineTo(headLen*0.40, -headR*0.35+4); ctx.stroke();
    } else if(acc === 'crown'){
      ctx.fillStyle = '#ffd24d';
      const baseY = -headR - 2;
      ctx.beginPath();
      ctx.moveTo(-headLen*0.05, baseY);
      ctx.lineTo(headLen*0.2, baseY - 10);
      ctx.lineTo(headLen*0.35, baseY);
      ctx.lineTo(headLen*0.55, baseY - 12);
      ctx.lineTo(headLen*0.75, baseY);
      ctx.fill();
    } else if(acc === 'bandana'){
      ctx.fillStyle = '#ff4d6d';
      ctx.beginPath();
      ctx.moveTo(-headLen*0.3, headR*0.6);
      ctx.quadraticCurveTo(headLen*0.2, headR*0.4, headLen*0.75, headR*0.9);
      ctx.lineTo(headLen*0.75, headR*0.6);
      ctx.closePath(); ctx.fill();
    } else if(acc === 'headset'){
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(-headLen*0.05, -headR*0.15, 8,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(-headLen*0.05, headR*0.15, 8,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#444'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(-headLen*0.05, -headR*0.15); ctx.quadraticCurveTo(headLen*0.2, -headR*0.9, headLen*0.6, -headR*0.9); ctx.stroke();
    } else if(acc === 'mask'){
      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.moveTo(headLen*0.05, -headR*0.25);
      ctx.quadraticCurveTo(headLen*0.25, 0, headLen*0.05, headR*0.25);
      ctx.quadraticCurveTo(-headLen*0.15, 0, headLen*0.05, -headR*0.25);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  function draw(){
    updateColor(1/60);
    drawBackground();
    if(food) drawFood();
    drawTrail();
    drawBody(interp);
    drawHead(interp);
  }

  /* -------------------------
     Input & UI bindings
     ------------------------- */
  window.addEventListener('keydown', e=>{
    switch(e.key){
      case 'ArrowUp': case 'w': case 'W': setDir(0,-1); break;
      case 'ArrowDown': case 's': case 'S': setDir(0,1); break;
      case 'ArrowLeft': case 'a': case 'A': setDir(-1,0); break;
      case 'ArrowRight': case 'd': case 'D': setDir(1,0); break;
      case ' ': paused = !paused; showNotification(paused ? 'Pause' : 'Lanjut'); break;
    }
  });

  function setDir(x,y){
    if(x === -dir.x && y === -dir.y && snake.length > 1) return;
    nextDir = {x,y};
  }

  startBtn.addEventListener('click', ()=>{
    if(!currentPlayer){ showNotification('Isi nama & negara di layar awal dulu!'); return; }
    highScore = getPlayerHigh(currentPlayer.name)?.score || 0;
    highEl.textContent = highScore;
    resetGame();
    lastTime = performance.now();
    requestAnimationFrame(loop);
    try{ bgm.volume = 0.35; bgm.play(); }catch(e){}
    showNotification('Permainan dimulai! Selamat bermain, ' + currentPlayer.name + (getFlagForCountryInput(currentPlayer.country)? ' ' + getFlagForCountryInput(currentPlayer.country):''));
  });

  pauseBtn.addEventListener('click', ()=>{ paused = !paused; showNotification(paused ? 'Pause' : 'Lanjut'); });

  speedUp.addEventListener('click', ()=>{ manualMult = Math.min(4, manualMult + 0.25); updateSpeed(); });
  speedDown.addEventListener('click', ()=>{ manualMult = Math.max(0.4, manualMult - 0.25); updateSpeed(); });

  /* -------------------------
     Main loop (frame-based)
     ------------------------- */
  function loop(ts){
    if(!lastTime) lastTime = ts;
    const dt = (ts - lastTime) / 1000; lastTime = ts;
    if(!running){ draw(); requestAnimationFrame(loop); return; }
    if(paused){ draw(); requestAnimationFrame(loop); return; }

    accumulator += dt;
    const secondsPerTile = 1 / tilesPerSecond;
    let stepped = false;
    while(accumulator >= secondsPerTile){
      performStep();
      accumulator -= secondsPerTile;
      stepped = true;
    }

    interp = Math.min(1, accumulator / secondsPerTile);
    draw();
    requestAnimationFrame(loop);
  }

  // Start initial idle rendering
  draw();
  loadLeaderboard();

  // track current player
  let currentPlayer = null;

  // When the window/tab reloads, keep intro visible. If you want to skip intro, you can call btnStartIntro.click() programmatically.

  // expose small API for demo/test (optional)
  window._game = { resetGame, performStep, getBoard: ()=>localStorage.getItem('snake_board') };

  // ensure proper rendering on resize
  function resizeCanvas() {
    // canvas CSS is fixed already; keep internal resolution constant for crisp tiles
    // nothing else needed, but you could adjust scaling for mobile
  }
  window.addEventListener('resize', resizeCanvas);
})();
</script>
